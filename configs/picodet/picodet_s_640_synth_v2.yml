_BASE_: [
  'picodet_s_640_synth_finetune_hardneg.yml',
]

pretrain_weights: output/picodet_s_640_synth_finetune_hardneg/best_model.pdparams
weights: output/picodet_s_640_synth_v2/best_model
save_dir: output/picodet_s_640_synth_v2

LearningRate:
  base_lr: 0.0003
  schedulers:
  - !CosineDecay
    max_epochs: 80
  - !LinearWarmup
    start_factor: 0.1
    steps: 50
